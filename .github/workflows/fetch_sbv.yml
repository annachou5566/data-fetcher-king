name: SBV Rate Daily

on:
  schedule:
    - cron: '5 2 * * 1-5'   # 09:05 ICT thứ 2-6 (SBV công bố ~8:30am)
  workflow_dispatch:          # Chạy thủ công lần đầu để backfill

permissions:
  contents: read

jobs:
  sbv-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 25      # Có retry + sleep giữa các page nên có thể chạy lâu hơn khi mạng chập chờn

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: { python-version: '3.11' }
    - uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-sbv-${{ hashFiles('requirements.txt') }}
        restore-keys: ${{ runner.os }}-pip-sbv-
    - run: pip install -r requirements.txt

    - name: Run — SBV Rate
      env:
        R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT_URL:      ${{ secrets.R2_ENDPOINT_URL }}
        R2_BUCKET_NAME:       ${{ secrets.R2_BUCKET_NAME }}
      run: python scripts/fetch_sbv.py
