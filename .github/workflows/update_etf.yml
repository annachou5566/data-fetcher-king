name: Update ETF Flows Data

on:
  schedule:
    # ── Price only (giờ giao dịch US: 14:30–21:00 UTC, Mon–Fri)
    - cron: '*/30 14-20 * * 1-5'   # mỗi 30 phút trong giờ giao dịch
    # ── Full data (sau market close: 22:00 UTC, Mon–Fri)
    - cron: '0 22 * * 1-5'         # 1 lần/ngày lấy NAV + holdings từ issuer
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'RUN_MODE: price | full'
        required: false
        default: 'full'

concurrency:
  group: update-etf-flows
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fetch-etf:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine RUN_MODE
        id: mode
        run: |
          # workflow_dispatch override
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.run_mode || 'full' }}" >> $GITHUB_OUTPUT
          # 22:00 UTC → full run
          elif [ "$(date -u +%H)" = "22" ]; then
            echo "mode=full" >> $GITHUB_OUTPUT
          else
            echo "mode=price" >> $GITHUB_OUTPUT
          fi

      - name: Run ETF Fetcher
        env:
          RUN_MODE:            ${{ steps.mode.outputs.mode }}
          R2_ACCESS_KEY_ID:    ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL:     ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET_NAME:      ${{ secrets.R2_BUCKET_NAME }}
          ETHERSCAN_API_KEY:   ${{ secrets.ETHERSCAN_API_KEY }}
        run: python scripts/fetch_etf.py
