name: Update ETF Flows Data

on:
  schedule:
    # ── Price only (giờ giao dịch US: 14:30–21:00 UTC, Mon–Fri)
    - cron: '*/30 14-20 * * 1-5'   # mỗi 30 phút trong giờ giao dịch
    # ── Full data — chạy 2 LẦN/ngày vì Farside cập nhật dữ liệu DẦN DẦN trong
    # ngày: các quỹ nhỏ (BITB, ARKB, MSBT...) thường có số ngay sau khi đóng cửa,
    # nhưng 2 quỹ lớn nhất (IBIT, FBTC) hay công bố TRỄ hơn nhiều giờ. Nếu chỉ
    # chạy 1 lần lúc 22:00 UTC (~5h sáng VN) sẽ hụt mất IBIT/FBTC của ngày đó,
    # khiến Flow bị thiếu (vd chỉ ra +$46.6M thay vì +$265.7M thực tế).
    - cron: '0 22 * * 1-5'         # Lần 1: ngay sau market close (~5h sáng VN)
    - cron: '0 11 * * 1-5'         # Lần 2: bổ sung IBIT/FBTC công bố trễ (~18h chiều VN)
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'RUN_MODE: price | full'
        required: false
        default: 'full'

concurrency:
  group: update-etf-flows
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fetch-etf:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine RUN_MODE
        id: mode
        run: |
          # workflow_dispatch override
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.run_mode || 'full' }}" >> $GITHUB_OUTPUT
          # So khớp ĐÚNG chuỗi cron đã lên lịch (github.event.schedule), KHÔNG so
          # giờ hệ thống lúc thực thi (date -u +%H) — vì GitHub Actions runner có
          # thể bị delay qua khỏi mốc giờ (vd chạy lúc 22:07 thay vì 22:00), khi đó
          # so "%H = 22" có thể sai lệch nếu delay đủ lớn để nhảy sang giờ khác.
          # github.event.schedule luôn giữ đúng chuỗi cron gốc bất kể chạy trễ bao lâu.
          elif [ "${{ github.event.schedule }}" = "0 22 * * 1-5" ] || [ "${{ github.event.schedule }}" = "0 11 * * 1-5" ]; then
            echo "mode=full" >> $GITHUB_OUTPUT
          else
            echo "mode=price" >> $GITHUB_OUTPUT
          fi

      - name: Run ETF Fetcher
        env:
          RUN_MODE:            ${{ steps.mode.outputs.mode }}
          R2_ACCESS_KEY_ID:    ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL:     ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET_NAME:      ${{ secrets.R2_BUCKET_NAME }}
          ETHERSCAN_API_KEY:   ${{ secrets.ETHERSCAN_API_KEY }}
        run: python scripts/fetch_etf.py
