// functions/api/etf-flows.js  (fix: RENDER_API_KEY)
const RENDER = 'https://alpha-realtime.onrender.com';

export async function onRequest(ctx) {
  const { request, env } = ctx;
  const origin = request.headers.get('Origin') || '';

  let allowedOrigin = 'https://wave-alpha.pages.dev';
  if (origin.endsWith('.github.dev') || origin.endsWith('idx.google.com') || origin.startsWith('http://localhost')) {
    allowedOrigin = origin;
  }

  if (request.method === 'OPTIONS') {
    return new Response(null, {
      status: 204,
      headers: {
        'Access-Control-Allow-Origin': allowedOrigin,
        'Access-Control-Allow-Methods': 'GET, OPTIONS',
        'Access-Control-Max-Age': '86400',
        'Vary': 'Origin',
      },
    });
  }

  try {
    const cache    = caches.default;
    const cacheKey = new Request(request.url, request);
    let response   = await cache.match(cacheKey);

    if (!response) {
      const apiKey = env.RENDER_API_KEY;   // ← dùng đúng tên giống market-data.js
      if (!apiKey) {
        return new Response(JSON.stringify({ error: 'Server misconfigured: Missing API Key' }), {
          status: 500,
          headers: { 'Access-Control-Allow-Origin': allowedOrigin },
        });
      }

      const upstream = `https://alpha-realtime.onrender.com/api/etf-flows`;
      const r = await fetch(upstream, {
        headers: { 'x-api-key': apiKey },
      });

      if (!r.ok) throw new Error(`Render ${r.status}`);

      const headers = new Headers(r.headers);
      headers.set('Access-Control-Allow-Origin', allowedOrigin);
      headers.set('Vary', 'Origin');
      headers.set('Cache-Control', 'public, s-maxage=120, stale-while-revalidate=60');

      response = new Response(r.body, { headers });
      ctx.waitUntil(cache.put(cacheKey, response.clone()));
    } else {
      const clone      = response.clone();
      const newHeaders = new Headers(clone.headers);
      newHeaders.set('Access-Control-Allow-Origin', allowedOrigin);
      response = new Response(clone.body, { headers: newHeaders });
    }

    return response;
  } catch (e) {
    return new Response(JSON.stringify({ error: e.message }), {
      status: 500,
      headers: { 'Access-Control-Allow-Origin': allowedOrigin },
    });
  }
}
