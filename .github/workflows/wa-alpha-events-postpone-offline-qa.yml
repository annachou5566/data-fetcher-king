name: WA Alpha Events postponed-notice offline QA (temporary)
on:
  push:
    branches:
      - fix/alpha-events-postpone-backend-20261118
    paths:
      - scripts/alpha_events_lite_schedule.py
      - scripts/test_alpha_events_lite_schedule.py
      - .github/workflows/wa-alpha-events-postpone-offline-qa.yml

# Read-only test: never accesses credentials, R2, or any deployment.
permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Run offline lifecycle and integrity regression
        working-directory: scripts
        run: python -m unittest -q test_alpha_events_lite_schedule test_alpha_events_completion_only_guard
