name: Temporary full Competition History price backfill

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-backfill-competition-history-prices.yml'

permissions:
  contents: read

concurrency:
  group: competition-history-price-r2-backfill
  cancel-in-progress: false

jobs:
  backfill:
    if: github.event.pull_request.head.ref == 'chatgpt/backfill-competition-history-prices-2026-08-05'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check boto3 requests
      - name: Backfill verified period-boundary prices
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROXY_WORKER_URL: ${{ secrets.PROXY_WORKER_URL }}
          BINANCE_INTERNAL_KLINES_API: ${{ secrets.BINANCE_INTERNAL_KLINES_API }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          import math
          import os
          import time
          import urllib.parse
          from datetime import datetime, timezone

          import boto3
          import requests
          from botocore.config import Config

          DAY_MS = 86_400_000
          HOUR_MS = 3_600_000
          MAX_DRIFT_MS = 2 * HOUR_MS
          PRICE_KEY = 'competition-price-series.json'
          CASE_SENSITIVE_CHAINS = {'501', 'CT_501', '784', 'CT_784', '195', 'CT_195'}
          SELECTED_IDS = {'143','149','150','152','154','155','156','157','158','159'}

          required = [
              'R2_ACCESS_KEY_ID', 'R2_SECRET_ACCESS_KEY', 'R2_ENDPOINT_URL',
              'R2_BUCKET_NAME', 'SUPABASE_URL', 'SUPABASE_SERVICE_ROLE_KEY'
          ]
          missing_env = [name for name in required if not os.getenv(name)]
          if missing_env:
              raise SystemExit('missing required workflow secrets: ' + ','.join(missing_env))

          def normalize_time(value, fallback):
              raw = str(value or fallback).strip()
              if len(raw) == 5:
                  raw += ':00'
              if len(raw) != 8:
                  raw = fallback
              return raw

          def parse_boundary(date_value, time_value, fallback):
              date = str(date_value or '')[:10]
              if len(date) != 10:
                  return None
              try:
                  return int(datetime.fromisoformat(date + 'T' + normalize_time(time_value, fallback) + '+00:00').timestamp() * 1000)
              except Exception:
                  return None

          def build_boundaries(meta):
              start = parse_boundary(meta.get('start'), meta.get('startTime'), '00:00:00')
              end = parse_boundary(meta.get('end') or meta.get('endDate'), meta.get('endTime'), '23:59:59')
              if not start or not end or end <= start:
                  return []
              multipliers = [value for value in (meta.get('multipliers') or []) if isinstance(value, (int, float))]
              exact_days = round((end - start) / DAY_MS)
              periods = len(multipliers) or max(1, exact_days)
              result = [{'slot': 0, 'boundaryAt': start}]
              for slot in range(1, periods + 1):
                  boundary = end if slot == periods else min(end, start + slot * DAY_MS)
                  if boundary > result[-1]['boundaryAt']:
                      result.append({'slot': slot, 'boundaryAt': boundary})
              return result

          def normalize_contract(contract, chain_id):
              value = str(contract or '').strip()
              return value if str(chain_id or 56) in CASE_SENSITIVE_CHAINS else value.lower()

          def kline_rows(payload):
              source = []
              if isinstance(payload, list):
                  source = payload
              elif isinstance(payload, dict):
                  data = payload.get('data')
                  if isinstance(data, list):
                      source = data
                  elif isinstance(data, dict) and isinstance(data.get('klineInfos'), list):
                      source = data['klineInfos']
              rows = []
              for row in source:
                  try:
                      if isinstance(row, list):
                          ts = int(float(row[0])); price = float(row[1])
                      else:
                          ts = int(float(row.get('timestamp', row.get('time', row.get('t')))))
                          price = float(row.get('openPrice', row.get('open')))
                      if ts < 100_000_000_000:
                          ts *= 1000
                      if ts > 0 and price > 0:
                          rows.append((ts, price))
                  except Exception:
                      continue
              rows.sort()
              return rows

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/121.0.0.0 Safari/537.36',
              'client-type': 'web',
              'Referer': 'https://www.binance.com/en/alpha',
              'Accept': 'application/json',
          })
          base = os.getenv('BINANCE_INTERNAL_KLINES_API') or 'https://www.binance.com/bapi/defi/v1/public/alpha-trade/agg-klines'
          proxy = os.getenv('PROXY_WORKER_URL') or ''

          def request_history(chain_id, contract, start_at, end_at):
              span_hours = max(1, math.ceil((end_at - start_at) / HOUR_MS))
              limit = min(1000, max(48, span_hours + 8))
              params = {
                  'chainId': str(chain_id or 56),
                  'interval': '1h',
                  'limit': str(limit),
                  'tokenAddress': contract,
                  'dataType': 'aggregate',
                  'endTime': str(end_at + MAX_DRIFT_MS),
              }
              target = base + ('&' if '?' in base else '?') + urllib.parse.urlencode(params)
              urls = []
              if proxy:
                  urls.append(proxy + ('&' if '?' in proxy else '?') + 'url=' + urllib.parse.quote(target, safe=''))
              urls.append(target)
              for url in urls:
                  try:
                      response = session.get(url, timeout=30)
                      if response.status_code != 200:
                          continue
                      payload = response.json()
                      rows = kline_rows(payload)
                      if rows:
                          return rows
                  except Exception:
                      continue
              return []

          supabase_url = os.environ['SUPABASE_URL'].rstrip('/')
          service_key = os.environ['SUPABASE_SERVICE_ROLE_KEY']
          response = requests.get(
              supabase_url + '/rest/v1/tournaments',
              params={'select': 'id,name,contract,data', 'order': 'id.desc'},
              headers={'apikey': service_key, 'Authorization': 'Bearer ' + service_key},
              timeout=45,
          )
          response.raise_for_status()
          tournaments = [row for row in response.json() if row.get('id') != -1]

          r2 = boto3.client(
              's3', endpoint_url=os.environ['R2_ENDPOINT_URL'],
              aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],
              config=Config(signature_version='s3v4'),
          )
          bucket = os.environ['R2_BUCKET_NAME']
          current_obj = r2.get_object(Bucket=bucket, Key=PRICE_KEY)
          current_bytes = current_obj['Body'].read()
          snapshot = json.loads(current_bytes.decode('utf-8'))
          if not isinstance(snapshot, dict):
              raise SystemExit('existing price snapshot is not an object')

          now_ms = int(time.time() * 1000)
          stored = 0
          failed = 0
          scanned = 0
          added_series = 0
          changed_ids = []

          for row in tournaments:
              meta = row.get('data') if isinstance(row.get('data'), dict) else {}
              boundaries = build_boundaries(meta)
              if not boundaries or boundaries[-1]['boundaryAt'] >= now_ms:
                  continue
              contract = row.get('contract') or meta.get('contractAddress') or meta.get('contract')
              chain_id = meta.get('chainId') or 56
              if not contract:
                  continue
              id_value = str(row['id'])
              existing = snapshot.get(id_value)
              if not isinstance(existing, dict):
                  existing = {
                      'id': id_value,
                      'alphaId': meta.get('alphaId'),
                      'symbol': row.get('name'),
                      'startAt': boundaries[0]['boundaryAt'],
                      'endAt': boundaries[-1]['boundaryAt'],
                      'points': [],
                  }
                  added_series += 1
              points = existing.get('points') if isinstance(existing.get('points'), list) else []
              known = {int(point.get('slot')) for point in points if isinstance(point, dict) and str(point.get('slot', '')).lstrip('-').isdigit()}
              missing = [boundary for boundary in boundaries if boundary['slot'] not in known]
              if not missing:
                  continue

              scanned += 1
              rows = request_history(
                  chain_id,
                  normalize_contract(contract, chain_id),
                  boundaries[0]['boundaryAt'],
                  boundaries[-1]['boundaryAt'],
              )
              if not rows:
                  failed += len(missing)
                  continue

              for boundary in missing:
                  best = min(rows, key=lambda item: (abs(item[0] - boundary['boundaryAt']), 0 if item[0] >= boundary['boundaryAt'] else 1))
                  drift = abs(best[0] - boundary['boundaryAt'])
                  if drift > MAX_DRIFT_MS:
                      failed += 1
                      continue
                  points.append({
                      'slot': boundary['slot'],
                      'boundaryAt': boundary['boundaryAt'],
                      'observedAt': best[0],
                      'price': best[1],
                      'quality': 'exact' if drift == 0 else 'nearest',
                      'driftMs': drift,
                      'source': 'binance-alpha',
                      'resolution': '1h',
                  })
                  known.add(boundary['slot'])
                  stored += 1

              points.sort(key=lambda point: int(point.get('slot', 0)))
              existing['points'] = points
              existing['startAt'] = boundaries[0]['boundaryAt']
              existing['endAt'] = boundaries[-1]['boundaryAt']
              snapshot[id_value] = existing
              if id_value not in changed_ids:
                  changed_ids.append(id_value)
              time.sleep(0.12)

          if stored <= 0:
              raise SystemExit(f'backfill made no progress: scanned={scanned} failed={failed}')

          stamp = datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%SZ')
          backup_key = f'competition-price-series-backups/{stamp}.json'
          r2.put_object(
              Bucket=bucket, Key=backup_key, Body=current_bytes,
              ContentType='application/json', CacheControl='no-store'
          )
          body = json.dumps(snapshot, separators=(',', ':')).encode('utf-8')
          r2.put_object(
              Bucket=bucket, Key=PRICE_KEY, Body=body,
              ContentType='application/json', CacheControl='public, max-age=300'
          )

          verify = json.loads(r2.get_object(Bucket=bucket, Key=PRICE_KEY)['Body'].read().decode('utf-8'))
          selected = {
              id_value: len((verify.get(id_value) or {}).get('points') or [])
              for id_value in sorted(SELECTED_IDS, key=int)
          }
          history_with_points = 0
          history_missing = 0
          for row in tournaments:
              meta = row.get('data') if isinstance(row.get('data'), dict) else {}
              boundaries = build_boundaries(meta)
              if not boundaries or boundaries[-1]['boundaryAt'] >= now_ms:
                  continue
              count = len((verify.get(str(row['id'])) or {}).get('points') or [])
              if count:
                  history_with_points += 1
              else:
                  history_missing += 1

          print(json.dumps({
              'backupKey': backup_key,
              'previousSeries': len(json.loads(current_bytes.decode('utf-8'))),
              'finalSeries': len(verify),
              'scannedTournaments': scanned,
              'storedPoints': stored,
              'failedBoundaries': failed,
              'addedSeries': added_series,
              'changedIds': len(changed_ids),
              'historyWithPoints': history_with_points,
              'historyMissing': history_missing,
              'selectedPointCounts': selected,
              'finalBytes': len(body),
          }, indent=2, ensure_ascii=False))

          if not all(selected[id_value] >= 2 for id_value in SELECTED_IDS):
              raise SystemExit('one or more visible History competitions still have fewer than two points')
          PY
