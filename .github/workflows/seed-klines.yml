name: Seed Klines to D1

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: 'Symbol cụ thể, ví dụ BTCUSDT (để trống = tất cả top 100)'
        required: false
        default: ''
      interval:
        description: 'Interval cụ thể: 1d 4h 1h 30m 15m 5m 1m (để trống = tất cả)'
        required: false
        default: ''
      quote:
        description: 'Quote asset: USDT USDC BTC ETH (để trống = tất cả 4 pairs)'
        required: false
        default: ''

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run seed script
        run: |
          python scripts/seed_klines.py \
            "${{ github.event.inputs.symbol }}" \
            "${{ github.event.inputs.interval }}" \
            "${{ github.event.inputs.quote }}"

      - name: Setup Node (Wrangler)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Import SQL files to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: bash import_to_d1.sh

      - name: Upload artifacts (backup + valid pairs list)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: klines-data-${{ github.run_id }}
          path: |
            klines_sql/
            valid_pairs.json
          retention-days: 7
