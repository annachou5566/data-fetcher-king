name: Seed Klines to D1

on:
  workflow_dispatch:
    inputs:
      batch:
        description: 'Chọn batch cần chạy'
        required: true
        type: choice
        options:
          - 'batch1_1w_1d'
          - 'batch2_4h_2h'
          - 'batch3_1h'
          - 'batch4_30m_15m'
          - 'batch5_5m_1m'
      quote:
        description: 'Quote asset: USDT USDC BTC ETH (trống = tất cả)'
        required: false
        default: 'USDT'
      resume_from:
        description: 'Resume từ symbol nào (trống = từ đầu)'
        required: false
        default: ''

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node (Wrangler)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Set intervals for batch
        id: set_intervals
        run: |
          case "${{ github.event.inputs.batch }}" in
            batch1_1w_1d)   echo "intervals=1w 1d" >> $GITHUB_OUTPUT ;;
            batch2_4h_2h)   echo "intervals=4h 2h" >> $GITHUB_OUTPUT ;;
            batch3_1h)      echo "intervals=1h"    >> $GITHUB_OUTPUT ;;
            batch4_30m_15m) echo "intervals=30m 15m" >> $GITHUB_OUTPUT ;;
            batch5_5m_1m)   echo "intervals=5m 1m"   >> $GITHUB_OUTPUT ;;
          esac

      - name: Download + Import per interval per symbol
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          DB_NAME="wave-alpha-klines"
          TOTAL_OK=0
          TOTAL_FAIL=0

          for INTERVAL in ${{ steps.set_intervals.outputs.intervals }}; do
            echo "════════════════════════════════════════"
            echo "  Interval: $INTERVAL"
            echo "════════════════════════════════════════"

            # Download interval này → tạo ra từng file SQL theo symbol
            python scripts/seed_klines.py \
              "" \
              "$INTERVAL" \
              "${{ github.event.inputs.quote }}" \
              "${{ github.event.inputs.resume_from }}"

            # Import TỪNG FILE MỘT — có delay + retry
            echo ""
            echo "📦 Bắt đầu import $INTERVAL vào D1..."
            OK=0
            FAIL=0

            for SQL_FILE in klines_sql/*.sql; do
              [ -f "$SQL_FILE" ] || continue
              NAME=$(basename "$SQL_FILE")

              # Retry tối đa 3 lần
              IMPORTED=false
              for ATTEMPT in 1 2 3; do
                if wrangler d1 execute "$DB_NAME" \
                     --file="$SQL_FILE" \
                     --remote > /dev/null 2>&1; then
                  echo "  ✅ $NAME"
                  IMPORTED=true
                  OK=$((OK+1))
                  break
                else
                  echo "  ⚠️  $NAME attempt $ATTEMPT failed, retry in 5s..."
                  sleep 5
                fi
              done

              if [ "$IMPORTED" = false ]; then
                echo "  ❌ $NAME FAILED"
                FAIL=$((FAIL+1))
              fi

              # Xóa file sau khi import để tiết kiệm disk
              rm -f "$SQL_FILE"

              # Delay 1.5s giữa mỗi symbol tránh D1 rate limit
              sleep 1.5
            done

            echo ""
            echo "  ✅ $INTERVAL: $OK OK / $FAIL FAIL"
            TOTAL_OK=$((TOTAL_OK+OK))
            TOTAL_FAIL=$((TOTAL_FAIL+FAIL))

            # Reset resume sau interval đầu
            # (chỉ resume interval đầu tiên thôi)
          done

          echo ""
          echo "════════════════════════════════════════"
          echo "  TỔNG KẾT"
          echo "  ✅ Thành công: $TOTAL_OK files"
          echo "  ❌ Thất bại:  $TOTAL_FAIL files"
          echo "════════════════════════════════════════"

      - name: Upload valid_pairs list
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valid-pairs-${{ github.event.inputs.batch }}-${{ github.run_id }}
          path: valid_pairs.json
          retention-days: 30
