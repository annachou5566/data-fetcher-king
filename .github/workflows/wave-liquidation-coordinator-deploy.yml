name: Wave Liquidation Coordinator Deploy

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact wave-alpha source SHA to deploy'
        required: true
        default: '1afce9dcc769789f2b92afa0c59e7ce41f921252'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wave-liquidation-coordinator-deploy.yml'

permissions:
  contents: read

concurrency:
  group: wave-liquidation-coordinator-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.head_ref == 'chatgpt/wave-liq-coordinator-runner')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_SHA: ${{ github.event.inputs.source_sha || '1afce9dcc769789f2b92afa0c59e7ce41f921252' }}
      COORDINATOR_URL: https://wave-alpha-liquidation-coordinator.wavealpha.workers.dev

    steps:
      - name: Validate exact source SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::source_sha must be a full 40-character commit SHA'; exit 2; }
          echo "SOURCE_SHA=$TARGET_SHA"

      - name: Fetch private wave-alpha source
        shell: bash
        env:
          WA_TOKEN_1: ${{ secrets.WAVE_ALPHA_REPO_TOKEN }}
          WA_TOKEN_2: ${{ secrets.GITHUB_PAT }}
          WA_TOKEN_3: ${{ secrets.GH_PAT }}
          WA_TOKEN_4: ${{ secrets.REPO_PAT }}
          WA_TOKEN_5: ${{ secrets.PAT_TOKEN }}
          WA_TOKEN_6: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          set -Eeuo pipefail
          TOKEN="${WA_TOKEN_1:-${WA_TOKEN_2:-${WA_TOKEN_3:-${WA_TOKEN_4:-${WA_TOKEN_5:-${WA_TOKEN_6:-}}}}}}"
          [ -n "$TOKEN" ] || { echo '::error::Missing private-repo token. Add repository secret WAVE_ALPHA_REPO_TOKEN with read access to annachou5566/wave-alpha.'; exit 10; }
          mkdir -p wave-alpha
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/annachou5566/wave-alpha/tarball/$TARGET_SHA" \
            -o /tmp/wave-alpha.tgz
          tar -xzf /tmp/wave-alpha.tgz --strip-components=1 -C wave-alpha
          test -f wave-alpha/workers/liquidation-coordinator/package-lock.json
          test -f wave-alpha/workers/liquidation-coordinator/src/worker.js
          echo 'PRIVATE_SOURCE_GATE=PASS'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.1'
          cache: npm
          cache-dependency-path: wave-alpha/workers/liquidation-coordinator/package-lock.json

      - name: Install and test coordinator
        working-directory: wave-alpha/workers/liquidation-coordinator
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          npm run test:contract
          npm test
          ./node_modules/.bin/wrangler deploy --dry-run --outdir /tmp/wave-liq-dry
          echo 'COORDINATOR_TEST_GATE=PASS'

      - name: Deploy production coordinator with side counts
        working-directory: wave-alpha/workers/liquidation-coordinator
        shell: bash
        env:
          CF_TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_TOKEN_2: ${{ secrets.CF_API_TOKEN }}
          CF_TOKEN_3: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_TOKEN_4: ${{ secrets.CF_TOKEN }}
          CF_ACCOUNT_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCOUNT_2: ${{ secrets.CF_ACCOUNT_ID }}
          KV_ID_1: ${{ secrets.WAVE_LIQ_KV_ID }}
          KV_ID_2: ${{ secrets.LIQ_KV_ID }}
        run: |
          set -Eeuo pipefail
          CF_TOKEN="${CF_TOKEN_1:-${CF_TOKEN_2:-${CF_TOKEN_3:-${CF_TOKEN_4:-}}}}"
          [ -n "$CF_TOKEN" ] || { echo '::error::Missing Cloudflare Workers token. Add repository secret CLOUDFLARE_API_TOKEN with Workers Scripts edit plus account/KV read access.'; exit 20; }

          CF_ACCOUNT="${CF_ACCOUNT_1:-${CF_ACCOUNT_2:-}}"
          if [ -z "$CF_ACCOUNT" ]; then
            ACCOUNTS="$(curl --fail --silent --show-error --retry 3 --max-time 30 -H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json' 'https://api.cloudflare.com/client/v4/accounts?per_page=50')"
            COUNT="$(printf '%s' "$ACCOUNTS" | jq '.result | length')"
            [ "$COUNT" = '1' ] || { echo '::error::Could not uniquely derive Cloudflare account. Add repository secret CLOUDFLARE_ACCOUNT_ID.'; exit 21; }
            CF_ACCOUNT="$(printf '%s' "$ACCOUNTS" | jq -r '.result[0].id')"
          fi

          KV_ID="${KV_ID_1:-${KV_ID_2:-}}"
          if [ -z "$KV_ID" ]; then
            KV_JSON="$(curl --fail --silent --show-error --retry 3 --max-time 30 -H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/storage/kv/namespaces?per_page=100")"
            KV_ID="$(printf '%s' "$KV_JSON" | jq -r '.result[] | select(.title == "liquidation-cache") | .id' | head -n1)"
          fi
          [ -n "$KV_ID" ] || { echo '::error::Could not derive liquidation-cache KV namespace. Add repository secret WAVE_LIQ_KV_ID.'; exit 22; }

          export CLOUDFLARE_API_TOKEN="$CF_TOKEN"
          export CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT"
          WR='./node_modules/.bin/wrangler'

          PRE="$(curl --fail --silent --show-error --retry 3 --max-time 20 "$COORDINATOR_URL/health")"
          printf '%s' "$PRE" | jq -e '.ok == true and .trafficEnabled == true and .ingestReady == true and .adminReady == true' >/dev/null
          echo 'PRE_HEALTH_GATE=PASS'

          CF_KV_ID="$KV_ID" node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("wrangler.jsonc","utf8"));p.keep_vars=true;p.vars={...(p.vars||{}),LIQ_TRAFFIC_ENABLED:"true"};p.kv_namespaces=[{binding:"LIQ_KV",id:process.env.CF_KV_ID}];fs.writeFileSync("wrangler.live.json",JSON.stringify(p,null,2));'

          "$WR" deploy --config wrangler.live.json --keep-vars --dry-run --outdir /tmp/wave-liq-live-dry
          echo 'LIVE_DRY_RUN_GATE=PASS'
          "$WR" deploy --config wrangler.live.json --keep-vars
          sleep 8

          rollback() {
            echo '::warning::Post-deploy gate failed; rolling back only wave-alpha-liquidation-coordinator.'
            "$WR" rollback --config wrangler.live.json --message 'rollback side-count deployment: post-deploy gate failed' || true
          }

          POST="$(curl --fail --silent --show-error --retry 4 --max-time 20 "$COORDINATOR_URL/health")" || { rollback; exit 30; }
          printf '%s' "$POST" | jq -e '.ok == true and .trafficEnabled == true and .ingestReady == true and .adminReady == true' >/dev/null || { rollback; exit 31; }
          echo 'POST_HEALTH_GATE=PASS'

          NOW_MS="$(($(date +%s)*1000))"
          FROM_MS="$((NOW_MS-86400000))"
          SNAP="$(curl --fail --silent --show-error --retry 4 --max-time 25 "$COORDINATOR_URL/snapshot?from=$FROM_MS&to=$NOW_MS")" || { rollback; exit 32; }
          printf '%s' "$SNAP" | jq -e '
            .ok == true and
            (.buckets | type == "object") and
            ([.buckets[] | select((.count // 0) > 0) | has("longCount") and has("shortCount") and has("sideCountObserved") and has("sideCountComplete")] | any)
          ' >/dev/null || { rollback; exit 33; }
          echo 'SIDE_COUNT_SCHEMA_GATE=PASS'

          "$WR" deployments status --config wrangler.live.json
          echo "DEPLOYED_SOURCE_SHA=$TARGET_SHA"
          echo 'LIQUIDATION_SIDE_COUNT_DEPLOY=PASS'
