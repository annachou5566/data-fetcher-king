name: P2P Rate Snapshot

on:
  schedule:
    - cron: '*/10 * * * *'   # P2P: mỗi 10 phút
    - cron: '35 1 * * *'     # VCB: 08:35 ICT hàng ngày
  workflow_dispatch:
    inputs:
      run_migration:
        description: 'Chạy migrate lịch sử P2P sang kiến trúc mới (1 lần, an toàn chạy lại nhiều lần)'
        type: boolean
        default: false
      migration_dry_run:
        description: 'Migrate ở chế độ dry-run (chỉ xem trước, không ghi R2)'
        type: boolean
        default: false
      run_vcb:
        description: 'Chạy VCB thủ công để test (mặc định KHÔNG chạy khi trigger P2P qua workflow_dispatch, ví dụ từ cron-job.org)'
        type: boolean
        default: false
      run_cleanup_liquidity:
        description: 'Dọn dẹp Liquidity Index cũ tính sai do cap lỏng (1 lần, an toàn chạy lại nhiều lần)'
        type: boolean
        default: false
      cleanup_dry_run:
        description: 'Cleanup Liquidity ở chế độ dry-run (chỉ xem trước, không ghi R2)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:

  p2p-snapshot:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '*/10 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: job-p2p-snapshot
      cancel-in-progress: false

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: { python-version: '3.11' }
    - uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-p2p-${{ hashFiles('requirements.txt') }}
        restore-keys: ${{ runner.os }}-pip-p2p-
    - run: pip install -r requirements.txt
    - name: Run — P2P Snapshot
      env:
        R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT_URL:      ${{ secrets.R2_ENDPOINT_URL }}
        R2_BUCKET_NAME:       ${{ secrets.R2_BUCKET_NAME }}
      run: python scripts/fetch_p2p.py

  p2p-migrate-history:
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.run_migration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: job-p2p-migrate-history
      cancel-in-progress: false

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: { python-version: '3.11' }
    - uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-p2p-${{ hashFiles('requirements.txt') }}
        restore-keys: ${{ runner.os }}-pip-p2p-
    - run: pip install -r requirements.txt
    - name: Run — Migrate P2P History
      env:
        R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT_URL:      ${{ secrets.R2_ENDPOINT_URL }}
        R2_BUCKET_NAME:       ${{ secrets.R2_BUCKET_NAME }}
      run: |
        if [ "${{ github.event.inputs.migration_dry_run }}" = "true" ]; then
          python scripts/migrate_p2p_history.py --dry-run
        else
          python scripts/migrate_p2p_history.py
        fi

  # ⚠️ MỚI: dọn dẹp Liquidity Index cũ (tính sai do cap SELL-side lỏng,
  # đã sửa trong fetch_p2p.py). Chỉ chạy khi bạn tự tay tick "run_cleanup_liquidity"
  # — không bao giờ chạy theo lịch cron, không bao giờ chạy do cron-job.org
  # tự động trigger workflow_dispatch định kỳ.
  p2p-cleanup-liquidity:
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.run_cleanup_liquidity == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: job-p2p-cleanup-liquidity
      cancel-in-progress: false

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: { python-version: '3.11' }
    - uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-p2p-${{ hashFiles('requirements.txt') }}
        restore-keys: ${{ runner.os }}-pip-p2p-
    - run: pip install -r requirements.txt
    - name: Run — Cleanup Old Liquidity
      env:
        R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT_URL:      ${{ secrets.R2_ENDPOINT_URL }}
        R2_BUCKET_NAME:       ${{ secrets.R2_BUCKET_NAME }}
      run: |
        if [ "${{ github.event.inputs.cleanup_dry_run }}" = "true" ]; then
          python scripts/cleanup_old_liquidity.py --dry-run
        else
          python scripts/cleanup_old_liquidity.py
        fi

  vcb-daily:
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_vcb == 'true') ||
      github.event.schedule == '35 1 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: job-vcb-daily
      cancel-in-progress: false

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: { python-version: '3.11' }
    - uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-vcb-${{ hashFiles('requirements.txt') }}
        restore-keys: ${{ runner.os }}-pip-vcb-
    - run: pip install -r requirements.txt
    - name: Run — VCB Daily
      env:
        R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT_URL:      ${{ secrets.R2_ENDPOINT_URL }}
        R2_BUCKET_NAME:       ${{ secrets.R2_BUCKET_NAME }}
      run: python scripts/fetch_vcb.py
