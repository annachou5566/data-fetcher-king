name: Sync Alpha Event Claim & Peak Prices

on:
  schedule:
    - cron: '*/30 * * * *'   # Mỗi 30 phút — chỉ token mới chưa có listing_price mới tốn request
  workflow_dispatch:
    inputs:
      legacy_history24h_cutover:
        description: 'One-time legacy History24h handoff; requires independent owner proof variables'
        type: boolean
        required: false
        default: false
      official1h_transition:
        description: 'Existing writer: one approved authenticated Binance official receipt handoff'
        type: boolean
        required: false
        default: false

concurrency:
  group: sync-listing-prices
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-alpha-event-prices:
    # OFF by default. During a separately approved History24h cutover,
    # pause scheduled price writes without disabling manual workflow_dispatch.
    # Preserve the original concurrency group; no extra scheduler.
    if: ${{ github.event_name != 'schedule' || vars.WA_ALPHA_EVENTS_HISTORY24H_SCHEDULE_FENCED != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30   # Tăng từ 15 → 30, đủ cho lần backfill đầu tiên chạy hết toàn bộ lịch sử

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: ${{ runner.os }}-pip-

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Qualify isolated R2 CAS and restore
      id: history24h_cas
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.legacy_history24h_cutover }}
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      working-directory: scripts
      run: python qualify_history24h_r2_cas.py

    - name: Calculate event Claim & Peak prices
      env:
        MAX_CONCURRENT: '6'
        BINANCE_INTERNAL_KLINES_API: ${{ secrets.BINANCE_INTERNAL_KLINES_API }}
        PROXY_WORKER_URL:            ${{ secrets.PROXY_WORKER_URL }}
        RENDER_API_KEY:              ${{ secrets.RENDER_API_KEY }}
        R2_ACCESS_KEY_ID:            ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY:        ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT_URL:             ${{ secrets.R2_ENDPOINT_URL }}
        R2_BUCKET_NAME:              ${{ secrets.R2_BUCKET_NAME }}
        # Prospective Active24h reuses this SAME scheduled writer; disabled
        # unless independently approved repository variable is exactly 1.
        # The manual legacy migration remains a separate explicit path.
        # Never infer event_time as firstActiveAt or create another writer.
        WA_ALPHA_EVENTS_HISTORY24H_CUTOVER_ENABLED: ${{ ((github.event_name == 'schedule' && (vars.WA_ALPHA_EVENTS_HISTORY24H_PROSPECTIVE_SCHEDULE_APPROVED == '1' || vars.WA_ALPHA_EVENTS_OFFICIAL1H_APPROVED == '1')) || (github.event_name == 'workflow_dispatch' && (inputs.legacy_history24h_cutover || (inputs.official1h_transition && vars.WA_ALPHA_EVENTS_OFFICIAL1H_APPROVED == '1')))) && '1' || '0' }}
        WA_ALPHA_EVENTS_HISTORY24H_LEGACY_PENDING_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.legacy_history24h_cutover && '1' || '0' }}
        WA_ALPHA_EVENTS_HISTORY24H_ACTIVE24H_ENABLED: ${{ github.event_name == 'schedule' && vars.WA_ALPHA_EVENTS_HISTORY24H_PROSPECTIVE_SCHEDULE_APPROVED == '1' && '1' || '0' }}
        # Separate new business policy; opt-in default OFF. Event-driven dispatch
        # is allowed only when the independently qualified new mode is ON.
        WA_ALPHA_EVENTS_OFFICIAL1H_ENABLED: ${{ ((github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.official1h_transition)) && vars.WA_ALPHA_EVENTS_OFFICIAL1H_APPROVED == '1') && '1' || '0' }}
        WA_ALPHA_EVENTS_OFFICIAL1H_SOURCE_MATCH_QUALIFIED: ${{ vars.WA_ALPHA_EVENTS_OFFICIAL1H_SOURCE_MATCH_QUALIFIED || '0' }}
        WA_ALPHA_EVENTS_OFFICIAL1H_SIGNED_PUBLISHER_QUALIFIED: ${{ vars.WA_ALPHA_EVENTS_OFFICIAL1H_SIGNED_PUBLISHER_QUALIFIED || '0' }}
        WA_ALPHA_EVENTS_OFFICIAL1H_R2_HISTORY_PAIR_QUALIFIED: ${{ vars.WA_ALPHA_EVENTS_OFFICIAL1H_R2_HISTORY_PAIR_QUALIFIED || '0' }}
        WA_ALPHA_EVENTS_OFFICIAL1H_FREE_HEADROOM_QUALIFIED: ${{ vars.WA_ALPHA_EVENTS_OFFICIAL1H_FREE_HEADROOM_QUALIFIED || '0' }}
        # All proof gates come from separately approved repository variables,
        # never from untrusted request input; Python fail-closes if any is OFF.
        WA_ALPHA_EVENTS_HISTORY24H_OWNER_APPROVED: ${{ vars.WA_ALPHA_EVENTS_HISTORY24H_OWNER_APPROVED || '0' }}
        WA_ALPHA_EVENTS_HISTORY24H_SINGLE_WRITER_FENCED: ${{ vars.WA_ALPHA_EVENTS_HISTORY24H_SINGLE_WRITER_FENCED || '0' }}
        WA_ALPHA_EVENTS_HISTORY24H_MANUAL_SEED_FENCED: ${{ vars.WA_ALPHA_EVENTS_HISTORY24H_MANUAL_SEED_FENCED || '0' }}
        WA_ALPHA_EVENTS_HISTORY24H_FIRSTLIVE_PROOF_QUALIFIED: '0'
        WA_ALPHA_EVENTS_HISTORY24H_ROLLBACK_VERIFIED: ${{ (((github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.official1h_transition)) && (vars.WA_ALPHA_EVENTS_HISTORY24H_PROSPECTIVE_SCHEDULE_APPROVED == '1' || vars.WA_ALPHA_EVENTS_OFFICIAL1H_APPROVED == '1')) && vars.WA_ALPHA_EVENTS_HISTORY24H_ROLLBACK_VERIFIED == '1' && '1') || steps.history24h_cas.outputs.rollback_verified || '0' }}
        WA_ALPHA_EVENTS_HISTORY24H_FREE_HEADROOM_QUALIFIED: ${{ vars.WA_ALPHA_EVENTS_HISTORY24H_FREE_HEADROOM_QUALIFIED || '0' }}
        WA_ALPHA_EVENTS_HISTORY24H_LEGACY_PENDING_OWNER_FENCED: ${{ vars.WA_ALPHA_EVENTS_HISTORY24H_LEGACY_PENDING_OWNER_FENCED || '0' }}
        WA_ALPHA_EVENTS_HISTORY24H_LEGACY_EXACT_MANIFEST: ${{ vars.WA_ALPHA_EVENTS_HISTORY24H_LEGACY_EXACT_MANIFEST || '[]' }}
        # Prospective-only proofs: must be independently qualified before
        # switching the existing 30-minute scheduled writer into this mode.
        # Gate FALSE means price-only behavior is unchanged.
        WA_ALPHA_EVENTS_HISTORY24H_FIRSTACTIVE_PROOF_QUALIFIED: ${{ vars.WA_ALPHA_EVENTS_HISTORY24H_FIRSTACTIVE_PROOF_QUALIFIED || '0' }}
        WA_ALPHA_EVENTS_HISTORY24H_ACTIVE_PUBLISHER_CAS_QUALIFIED: ${{ vars.WA_ALPHA_EVENTS_HISTORY24H_ACTIVE_PUBLISHER_CAS_QUALIFIED || '0' }}
        WA_ALPHA_EVENTS_HISTORY24H_ORACLE_REPLAY_QUALIFIED: ${{ vars.WA_ALPHA_EVENTS_HISTORY24H_ORACLE_REPLAY_QUALIFIED || '0' }}
      working-directory: scripts
      run: python sync_listing_prices.py
