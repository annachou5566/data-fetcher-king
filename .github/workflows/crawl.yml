name: Crawl Grayscale BTC

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug workspace
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          pwd
          ls -la
          find . -maxdepth 4 -type f | sort

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          crawl4ai-setup || echo "crawl4ai-setup failed, continuing anyway"

      - name: Verify scripts/crawl.py exists
        run: |
          test -f ./scripts/crawl.py
          echo "scripts/crawl.py found"

      - name: Run crawler
        working-directory: ${{ github.workspace }}
        run: python ./scripts/crawl.py
        continue-on-error: true

      - name: Show output preview
        if: always()
        run: python ./scripts/preview_output.py

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grayscale-btc-json
          path: ./scripts/grayscale_btc.json
          if-no-files-found: warn
