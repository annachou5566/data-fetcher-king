name: Alpha History CP Price Apply One Shot

on:
  push:
    branches:
      - chatgpt/alpha-history-merge-backfill-2026-09-25
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-listing-prices
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: |
          python -m unittest scripts/test_sync_alpha_history_merge.py
          python -m unittest scripts/test_enrich_alpha_history_gap.py

      - name: R2 merge dry-run
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python scripts/sync_alpha_history.py --input data/airdrops.json --no-prices --max-add 100

      - name: CP exact pre-apply qualification
        env:
          MAX_CONCURRENT: "1"
          BINANCE_INTERNAL_KLINES_API: ${{ secrets.BINANCE_INTERNAL_KLINES_API }}
          PROXY_WORKER_URL: ${{ secrets.PROXY_WORKER_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        working-directory: scripts
        run: |
          python enrich_alpha_history_gap.py --workers 1 --cp-only --require-data | tee /tmp/cp-price-preapply.log
          grep -Fq "[guard] targets_all=12 targets_history=12" /tmp/cp-price-preapply.log
          grep -Fq "[guard] old_all_rows=431 old_history_rows=431" /tmp/cp-price-preapply.log
          grep -Fq "[guard] old_all_digest=16f9795ff0c56478209c8a7f8e9aa76fe903c7851c749b77212e970cb73de0fd" /tmp/cp-price-preapply.log
          grep -Fq "[guard] old_history_digest=16f9795ff0c56478209c8a7f8e9aa76fe903c7851c749b77212e970cb73de0fd" /tmp/cp-price-preapply.log
          grep -Fq "[result] CP 2026-09-04T07:00:00+00:00 PASS" /tmp/cp-price-preapply.log
          grep -Fq "[guard] non_target_rows_unchanged=PASS" /tmp/cp-price-preapply.log
          grep -Fq "[guard] other_11_targets_unchanged=PASS" /tmp/cp-price-preapply.log
          grep -Fq "[guard] target_field_scope=PASS" /tmp/cp-price-preapply.log
          grep -Fq "[mutation] NONE" /tmp/cp-price-preapply.log

      - name: Apply exact CP price fields
        env:
          MAX_CONCURRENT: "1"
          BINANCE_INTERNAL_KLINES_API: ${{ secrets.BINANCE_INTERNAL_KLINES_API }}
          PROXY_WORKER_URL: ${{ secrets.PROXY_WORKER_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        working-directory: scripts
        run: |
          python enrich_alpha_history_gap.py --workers 1 --cp-only --require-data --apply | tee /tmp/cp-price-apply.log
          grep -Fq "[postcheck] all=443 history=443" /tmp/cp-price-apply.log
          grep -Fq "[postcheck] cp_listing_price=1/1" /tmp/cp-price-apply.log
          grep -Fq "[postcheck] other_11_targets_unchanged=PASS" /tmp/cp-price-apply.log
          grep -Fq "[postcheck] non_target_rows_unchanged=PASS" /tmp/cp-price-apply.log
          grep -Fq "[mutation] TARGETED_CP_PRICE_FIELDS" /tmp/cp-price-apply.log
          grep -Fq "[done] targeted CP Alpha History price enrichment PASS" /tmp/cp-price-apply.log
