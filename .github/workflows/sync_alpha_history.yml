name: Sync Alpha History Dry Run

on:
  push:
    branches:
      - chatgpt/alpha-history-merge-backfill-2026-09-25
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: |
          python -m unittest scripts/test_sync_alpha_history_merge.py
          python -m unittest scripts/test_enrich_alpha_history_gap.py

      - name: R2 merge dry-run
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python scripts/sync_alpha_history.py --input data/airdrops.json --no-prices --max-add 100

      - name: CP targeted price qualification dry-run
        env:
          MAX_CONCURRENT: "4"
          BINANCE_INTERNAL_KLINES_API: ${{ secrets.BINANCE_INTERNAL_KLINES_API }}
          PROXY_WORKER_URL: ${{ secrets.PROXY_WORKER_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        working-directory: scripts
        run: |
          python enrich_alpha_history_gap.py --workers 1 --cp-only --require-data | tee /tmp/cp-price-dry-run.log
          grep -Fq "[result] CP 2026-09-04T07:00:00+00:00 PASS" /tmp/cp-price-dry-run.log
          grep -Fq "[guard] non_target_rows_unchanged=PASS" /tmp/cp-price-dry-run.log
          grep -Fq "[guard] other_11_targets_unchanged=PASS" /tmp/cp-price-dry-run.log
          grep -Fq "[guard] target_field_scope=PASS" /tmp/cp-price-dry-run.log
          grep -Fq "[mutation] NONE" /tmp/cp-price-dry-run.log
