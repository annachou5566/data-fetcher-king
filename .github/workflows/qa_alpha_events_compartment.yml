name: One-shot Alpha Events compartment boundary QA
on:
  push:
    branches:
      - fix/alpha-events-compartment-fence-20261017
    paths:
      - .github/workflows/qa_alpha_events_compartment.yml
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source-only no-credential and compat regressions
        run: |
          python3 -m py_compile scripts/alpha_events_official_onehour.py scripts/test_alpha_events_official_onehour.py
          python3 -m unittest discover -s scripts -p 'test_alpha_events_official_onehour.py' -v
          python3 -m unittest discover -s scripts -p 'test_*24h*.py' -v
