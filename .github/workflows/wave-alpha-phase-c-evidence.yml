name: Wave Alpha Phase C evidence

on:
  pull_request:
    paths:
      - 'scripts/wave_alpha_phase_c_observer.mjs'
      - 'scripts/post_wave_alpha_phase_c_evidence.mjs'
      - '.github/workflows/wave-alpha-phase-c-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/wave_alpha_phase_c_observer.mjs'
      - 'scripts/post_wave_alpha_phase_c_evidence.mjs'
      - '.github/workflows/wave-alpha-phase-c-evidence.yml'
  workflow_dispatch:
  schedule:
    - cron: '37 */2 * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: wave-alpha-phase-c-evidence-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check scripts/wave_alpha_phase_c_observer.mjs
          node --check scripts/post_wave_alpha_phase_c_evidence.mjs
      - name: Bounded first-party observer
        run: node scripts/wave_alpha_phase_c_observer.mjs
      - name: Persist only novel public evidence
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WAVE_PHASE_C_ISSUE: '5'
        run: node scripts/post_wave_alpha_phase_c_evidence.mjs
