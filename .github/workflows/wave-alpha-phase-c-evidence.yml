name: Wave Alpha Phase C evidence

on:
  pull_request:
    paths:
      - 'scripts/wave_alpha_phase_c_observer.mjs'
      - 'scripts/post_wave_alpha_phase_c_evidence.mjs'
      - 'scripts/wave_alpha_public_health.mjs'
      - 'scripts/wave_alpha_hyperliquid_fallback_probe.mjs'
      - '.github/workflows/wave-alpha-phase-c-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/wave_alpha_phase_c_observer.mjs'
      - 'scripts/post_wave_alpha_phase_c_evidence.mjs'
      - 'scripts/wave_alpha_public_health.mjs'
      - 'scripts/wave_alpha_hyperliquid_fallback_probe.mjs'
      - '.github/workflows/wave-alpha-phase-c-evidence.yml'
  workflow_dispatch:
  schedule:
    - cron: '37 */2 * * *'

permissions:
  contents: read

concurrency:
  group: wave-alpha-phase-c-evidence-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Evidence syntax check
        run: |
          node --check scripts/wave_alpha_phase_c_observer.mjs
          node --check scripts/post_wave_alpha_phase_c_evidence.mjs
          node --check scripts/wave_alpha_hyperliquid_fallback_probe.mjs
      - name: Bounded first-party observer
        run: node scripts/wave_alpha_phase_c_observer.mjs
      - name: Hyperliquid third-party fallback qualification
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            UTC_HOUR="$(date -u +%H)"
            if [[ "$UTC_HOUR" != "02" && "$UTC_HOUR" != "03" ]]; then
              echo "hyperliquidFallbackProbe=SKIPPED_DAILY_CADENCE"
              exit 0
            fi
          fi
          node scripts/wave_alpha_hyperliquid_fallback_probe.mjs
      - name: Persist only novel public evidence
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WAVE_PHASE_C_ISSUE: '5'
        run: node scripts/post_wave_alpha_phase_c_evidence.mjs

  health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Health syntax check
        run: node --check scripts/wave_alpha_public_health.mjs
      - name: Wave Alpha public runtime smoke
        run: node scripts/wave_alpha_public_health.mjs
