name: Wave Alpha Phase C evidence

# Phase C evidence is retired from automatic monitoring.
# Keep this workflow only for explicit, bounded historical/manual investigation.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wave-alpha-phase-c-evidence-manual
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Evidence syntax check
        run: |
          node --check scripts/wave_alpha_phase_c_observer.mjs
          node --check scripts/post_wave_alpha_phase_c_evidence.mjs
      - name: Bounded first-party observer
        run: node scripts/wave_alpha_phase_c_observer.mjs
      - name: Persist only novel public evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WAVE_PHASE_C_ISSUE: '5'
        run: node scripts/post_wave_alpha_phase_c_evidence.mjs

  health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Health syntax check
        run: node --check scripts/wave_alpha_public_health.mjs
      - name: Wave Alpha public runtime smoke
        run: node scripts/wave_alpha_public_health.mjs
