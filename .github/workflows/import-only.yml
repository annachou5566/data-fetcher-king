name: Import SQL to D1 (from artifact)

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: 'Artifact ID từ run trước (lấy từ URL artifact)'
        required: true
      run_id:
        description: 'Run ID của workflow đã chạy'
        required: true

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Download artifact từ run trước
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Download artifact zip
            const artifact = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: parseInt('${{ github.event.inputs.artifact_id }}'),
              archive_format: 'zip'
            });

            // Lưu file zip
            fs.writeFileSync('artifact.zip', Buffer.from(artifact.data));
            console.log('✅ Downloaded artifact.zip');

      - name: Extract SQL files
        run: |
          mkdir -p klines_sql
          unzip -o artifact.zip -d extracted/
          # Tìm và move tất cả .sql files
          find extracted/ -name "*.sql" -exec mv {} klines_sql/ \;
          echo "📦 SQL files:"
          ls klines_sql/ | head -20
          echo "Total: $(ls klines_sql/*.sql 2>/dev/null | wc -l) files"

      - name: Setup Node (Wrangler)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Import từng file vào D1 (có delay, retry)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          DB_NAME="wave-alpha-klines"
          SUCCESS=0
          FAIL=0

          for SQL_FILE in klines_sql/*.sql; do
            NAME=$(basename "$SQL_FILE")
            echo "📦 Importing $NAME..."

            # Thử tối đa 3 lần
            for ATTEMPT in 1 2 3; do
              if wrangler d1 execute $DB_NAME --file="$SQL_FILE" --remote 2>&1; then
                echo "  ✅ $NAME done (attempt $ATTEMPT)"
                SUCCESS=$((SUCCESS + 1))
                break
              else
                echo "  ⚠️ Attempt $ATTEMPT failed, waiting 5s..."
                sleep 5
                if [ $ATTEMPT -eq 3 ]; then
                  echo "  ❌ $NAME FAILED after 3 attempts"
                  FAIL=$((FAIL + 1))
                fi
              fi
            done

            # Delay giữa các file để tránh rate limit
            sleep 2
          done

          echo ""
          echo "════════════════════════"
          echo "✅ Success: $SUCCESS files"
          echo "❌ Failed:  $FAIL files"
          echo "════════════════════════"
