name: Update Competition Charts

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: update-competition-charts

permissions:
  contents: read

jobs:
  update-charts:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Get current UTC hour
        id: hour
        run: echo "value=$(date -u +'%Y-%m-%d-%H')" >> "$GITHUB_OUTPUT"

      - name: Restore hourly lock
        id: hourly_lock
        uses: actions/cache@v4
        with:
          path: .run-state/hourly-lock.txt
          key: hourly-lock-${{ steps.hour.outputs.value }}

      - name: Stop if already ran this hour
        if: steps.hourly_lock.outputs.cache-hit == 'true'
        run: |
          echo "Already processed hour ${{ steps.hour.outputs.value }}"
          exit 0

      - name: Create hourly lock file
        run: |
          mkdir -p .run-state
          echo "${{ steps.hour.outputs.value }}" > .run-state/hourly-lock.txt

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Competition Fetcher
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROXY_WORKER_URL: ${{ secrets.PROXY_WORKER_URL }}
          BINANCE_INTERNAL_KLINES_API: ${{ secrets.BINANCE_INTERNAL_KLINES_API }}
        run: |
          python scripts/fetch_competition.py
