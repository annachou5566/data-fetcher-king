name: P2P Liquidity V2 R2 Read-Only Verify

on:
  push:
    branches:
      - chatgpt/p2p-liquidity-v2-r1-r2-verify-2026-09-28

permissions:
  contents: read

jobs:
  r2-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded dependency
        run: pip install boto3
      - name: Verify existing P2P R2 objects read-only
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python scripts/verify_p2p_liquidity_v2_r2.py
