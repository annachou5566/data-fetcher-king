name: Hyperliquid global liquidation action research

on:
  pull_request:
    paths:
      - 'scripts/research_hyperliquid_global_liquidation_actions.mjs'
      - '.github/workflows/research-hyperliquid-global-liquidation-actions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check scripts/research_hyperliquid_global_liquidation_actions.mjs
      - name: Public Explorer action probe
        run: node scripts/research_hyperliquid_global_liquidation_actions.mjs
