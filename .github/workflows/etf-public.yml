name: ETF Public Probe

on:
  workflow_dispatch:
  schedule:
    - cron: "15 1 * * *"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests cloudscraper boto3 beautifulsoup4

      - name: Run ETF public probe
        env:
          RUN_MODE: probe
          READ_R2: "0"
        run: |
          python scripts/fetch_etf_public.py
