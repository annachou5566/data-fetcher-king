name: Update Alpha Market Data

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: update-alpha-market
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: ${{ runner.os }}-pip-

    - name: Install dependencies
      run: pip install -r requirements.txt

    # ── STEP 1: Market Data (giữ nguyên, không đổi) ────────────────────
    - name: Run — Market Data
      env:
        RUN_MODE: market_data
        MAX_WORKERS: '6'
        MAX_CONCURRENT: '4'
        BINANCE_INTERNAL_AGG_API:    ${{ secrets.BINANCE_INTERNAL_AGG_API }}
        BINANCE_INTERNAL_KLINES_API: ${{ secrets.BINANCE_INTERNAL_KLINES_API }}
        PROXY_WORKER_URL:            ${{ secrets.PROXY_WORKER_URL }}
        R2_ACCESS_KEY_ID:            ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY:        ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT_URL:             ${{ secrets.R2_ENDPOINT_URL }}
        R2_BUCKET_NAME:              ${{ secrets.R2_BUCKET_NAME }}
      run: python scripts/fetch_alpha.py

    # ── STEP 2: P2P Snapshot (độc lập, lỗi không ảnh hưởng Step 1) ────
    - name: Run — P2P Snapshot
      # continue-on-error: true — P2P lỗi không làm fail toàn bộ workflow
      continue-on-error: true
      env:
        R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT_URL:      ${{ secrets.R2_ENDPOINT_URL }}
        R2_BUCKET_NAME:       ${{ secrets.R2_BUCKET_NAME }}
      run: python scripts/fetch_p2p.py
