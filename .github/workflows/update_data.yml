name: Update Alpha Market Data

on:
  schedule:
    - cron: '*/10 * * * *' # Mỗi 10 phút (từ 30 phút)
  workflow_dispatch:

# Đảm bảo không bao giờ chạy 2 lần đồng thời
# cancel-in-progress: false = đợi run cũ xong, KHÔNG kill giữa chừng
concurrency:
  group: update-alpha-market
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # Hard-kill nếu bị treo

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: ${{ runner.os }}-pip-

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run — Market Data Only
      env:
        RUN_MODE: market_data   # Chỉ update market-data.json, không cắt đuôi
        MAX_WORKERS: '6'        # 6 threads xử lý token song song
        MAX_CONCURRENT: '4'     # Tối đa 4 HTTP request đến Binance cùng lúc (van an toàn)
        BINANCE_INTERNAL_AGG_API:    ${{ secrets.BINANCE_INTERNAL_AGG_API }}
        BINANCE_INTERNAL_KLINES_API: ${{ secrets.BINANCE_INTERNAL_KLINES_API }}
        PROXY_WORKER_URL:            ${{ secrets.PROXY_WORKER_URL }}
        R2_ACCESS_KEY_ID:            ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY:        ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT_URL:             ${{ secrets.R2_ENDPOINT_URL }}
        R2_BUCKET_NAME:              ${{ secrets.R2_BUCKET_NAME }}
      run: python scripts/fetch_alpha.py
